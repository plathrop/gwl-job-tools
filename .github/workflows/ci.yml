name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow only builds and tests; it needs no write access. Least
# privilege matters because pull_request runs untrusted fork code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      # cargo test builds the lib and bins already; a separate build step
      # would be redundant.
      - name: Test
        run: cargo test --locked

      - name: Test (no default features)
        run: cargo test --locked --no-default-features
