[package]
name = "gwl-job-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env", "cargo", "unicode", "wrap_help"] }
directories = "6.0.0"
miette = { version = "7.6.0", features = ["fancy", "derive"] }
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry-stdout = { version = "0.32.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
